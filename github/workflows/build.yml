name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.11.1

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name WindowHider window_hider.py

      - uses: actions/upload-artifact@v4
        with:
          name: WindowHider-exe
          path: dist/WindowHider.exe

      - name: Attach EXE to GitHub Release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WindowHider.exe
